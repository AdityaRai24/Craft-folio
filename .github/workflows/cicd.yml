name: Deploy Next.js application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" >> .env
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}" >> .env
          echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}" >> .env
          echo "NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}" >> .env
          echo "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "NEXT_PUBLIC_CLOUDINARY_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_PRESET }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env

      - name: Build docker image
        run: docker build -t adityarai24/craft-folio-app .

      - name: Login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Publish image to docker hub
        run: docker push adityarai24/craft-folio-app:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Check disk space before cleanup
        run: |
          df -h
          docker system df

      - name: Clear npm cache and temp files
        run: |
          npm cache clean --force || true
          rm -rf ~/.npm || true
          rm -rf /tmp/* || true
          rm -rf /var/tmp/* || true

      - name: Stop and remove all containers
        run: |
          docker stop $(docker ps -aq) || true
          docker rm $(docker ps -aq) || true

      - name: Remove all Docker images
        run: |
          docker rmi $(docker images -aq) || true

      - name: Clean up Docker system
        run: |
          docker system prune -af --volumes

      - name: Clean up Docker build cache
        run: |
          docker builder prune -af

      - name: Clear Docker cache directories
        run: |
          rm -rf /var/lib/docker/tmp/* || true
          rm -rf /var/lib/docker/overlay2/* || true

      - name: Check disk space after cleanup
        run: |
          df -h
          docker system df

      - name: Pull image from docker hub
        run: docker pull adityarai24/craft-folio-app:latest

      - name: Run docker container
        run: docker run -d -p 3000:3000 --name craftfolio-container adityarai24/craft-folio-app

  deploy-alternative:
    needs: build
    runs-on: self-hosted
    if: failure()
    steps:
      - name: Emergency cleanup
        run: |
          docker system prune -af --volumes
          docker builder prune -af
          rm -rf /var/lib/docker/* || true
          df -h

      - name: Pull and run with minimal resources
        run: |
          docker pull adityarai24/craft-folio-app:latest
          docker run -d -p 3000:3000 --name craftfolio-container --memory=512m --storage-opt size=1G adityarai24/craft-folio-app
